name: Build Preset Index

on:
  push:
    branches:
      - presets

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --global glob@10.3.10

      - name: Generate index.json
        run: node scripts/generate-index.js

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add presets/index.json
          git commit -m "chore: update index.json [skip ci]" || echo "No changes"
          git push
